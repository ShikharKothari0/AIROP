spring.application.name=AIROP

spring.datasource.url=jdbc:postgresql://localhost:5433/airop?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=8082
spring.flyway.validate-migration-naming=true

airop.jwt.secret=${JWT_SECRET}
airop.jwt.expiration=3600000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=airop-alert-consumer
spring.kafka.consumer.auto-offset-reset=earliest
# Limit how long the producer waits for Kafka
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.properties.reconnect.backoff.ms=1000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=10000
spring.kafka.consumer.properties.retry.backoff.ms=500

# Limit how long the consumer waits before retrying a connection
spring.kafka.listener.poll-timeout=1000


# ==============================
# ACTUATOR CONFIGURATION
# ==============================

# Expose health, info, and Prometheus metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Show health details for authorized users
management.endpoint.health.show-details=when_authorized

# Enable application information endpoint
management.info.env.enabled=true

# Application metadata
info.app.name=AIROP
info.app.description=AI Reliability Operations Platform
info.app.version=0.0.1-SNAPSHOT