services:

  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: airop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: airop
      POSTGRES_USER: airop_user
      POSTGRES_PASSWORD: airop_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airop_user -d airop"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Redis
  redis:
    image: redis:7-alpine
    container_name: airop-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: airop-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log


  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: airop-kafka
    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_started

    ports:
      - "9092:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10


  # Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: airop-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


  # Mailpit
  # Local email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: airop-mailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"


# Persistent Volumes
volumes:

  postgres_data:

  redis_data:

  zookeeper_data:

  zookeeper_logs:

  kafka_data:

  qdrant_data: